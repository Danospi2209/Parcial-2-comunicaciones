version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  joomla_data:

services:
  database:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  joomla:
    image: joomla:latest
    container_name: joomla
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_TYPE: ${JOOMLA_DB_TYPE}
      JOOMLA_DB_USER: ${POSTGRES_USER}
      JOOMLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JOOMLA_DB_NAME: ${POSTGRES_DB}
    volumes:
      - joomla_data:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
    depends_on:
      - joomla

  jupyter:
    image: jupyter/base-notebook
    container_name: jupyter
    environment:
      JUPYTER_TOKEN: ""
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.base_url=/jupyter/ --ServerApp.token=''
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    networks:
      - frontend_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy